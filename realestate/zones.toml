# 관심 구역 정의
#
# 실거래가 API는 "시군구(lawd_cd) + 계약월" 단위로만 조회됩니다.
# 그래서 시군구 전체 거래를 받아온 뒤 법정동(dongs)과 지번 본번(bonbun)으로 구역 내 거래만 걸러냅니다.
#
# - bonbun: 구역에 포함되는 지번의 "본번" 목록. "360" 이면 360, 360-1, 360-15 … 가 모두 매칭됩니다.
#           비워두면 해당 법정동 전체 거래가 이 구역으로 잡힙니다(구역 밖 거래가 섞임).
#           정확한 지번은 정비구역 지정 고시문 / 서울시 정비사업 정보몽땅(cleanup.seoul.go.kr)에서 확인해 채우세요.
#           구역별 전체 지번 목록은 텍스트로 공개된 자료가 없어 비워 두었습니다.
#           molit_trades.py 를 한 번 돌리면 나오는 trades_bonbun.csv(본번별 거래 건수)를
#           토지이음(eum.go.kr) 지형도면과 대조해 구역 안 본번만 옮겨 적으면 됩니다.
# - note:   대표 지번(언론·조합 공시 기준, 2026-10 확인)
# - nearby_new_ppp: 입주 후 비교 대상이 될 주변 신축 시세, 공급면적 3.3㎡당 만원.
#                   rank_listings.py 의 "안전마진" 계산에 쓰입니다. 0 이면 계산하지 않습니다.
#                   84㎡(공급 약 34평) 실거래 기준으로 잡았고, 근거는 각 구역의 ppp_basis 에 적었습니다.
#                   입주 후 "기대 시세"가 아니라 현재 실거래 기준이라 보수적인 값입니다.
# - default_ratio:  비례율(%) 기본값. 매물 CSV 에 비례율이 비어 있으면 이 값을 씁니다.
#
# 시군구 코드: 용산구 11170, 성동구 11200, 서초구 11650, 강남구 11680, 송파구 11710, 동작구 11590, 마포구 11440

[[zone]]
name = "한남2구역"
lawd_cd = "11170"
dongs = ["보광동", "이태원동"]
bonbun = []
