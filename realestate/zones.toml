nearby_new_ppp = 10000
ppp_basis = "한남 일대 84㎡ 신축 실거래 없음. 한남더힐(2011) 평균 약 8,900, 한남뉴타운 입주 후 기대 1억(언론). 2구역은 3·4·5구역보다 입지 열위로 보고 1억 적용"
default_ratio = 100

